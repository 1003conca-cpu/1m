name: Agent Status Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update status
        run: python agent-control-center/scripts/update_status.py

      - name: Commit heartbeat
        run: |
          git config user.name "agent-state-monitor"
          git config user.email "agent-state-monitor@users.noreply.github.com"
          git add agent-control-center/status/CURRENT_STATUS.md
          if git diff --cached --quiet; then
            echo "No status change"
            exit 0
          fi
          git commit -m "chore(agent-status): 5-minute heartbeat"
          git push
